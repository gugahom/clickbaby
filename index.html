<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O tema é CLARO desde a virada do chão pastel; os dois valores aqui
         ficaram de uma versão anterior e faziam o navegador desenhar barra e
         formulários nativos em escuro sobre uma tela clara. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2b2540" />

    <!--
      PLUS JAKARTA SANS, e só ela para texto.

      A tela vinha na stack do sistema, e isso explica boa parte de por que ela
      parecia mais crua que a referência: nenhuma escolha tipográfica tinha
      sido feita. A Plus Jakarta Sans resolve isso sozinha — altura de x
      generosa (importante para 13px lidos de pé num corredor) e oito pesos,
      que é o que dá hierarquia sem precisar de uma segunda família. Números
      continuam na JetBrains Mono, mas SÓ como código: sigla de maternidade,
      "pc-1", LOCAL/REMOTO.

      A SYNE SAIU (30/08/2026, a pedido do gestor). Ela carregava o título da
      tela — um h1, um por página — e nada mais. Duas famílias display para um
      elemento é peso de rede que nenhum leitor recebe de volta, e o próprio
      pedido foi de padronizar o título na fonte do resto. O contraste que ela
      dava agora vem do peso 800 da Jakarta, que já estava sendo baixado.

      `display=swap` de propósito: a seção 6 do CLAUDE.md diz que o sinal cai.
      Com swap, a tela aparece na fonte do sistema e troca quando a web font
      chega; sem ele, ficaria em branco esperando a rede.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Painel de atividades · Clickbaby</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
